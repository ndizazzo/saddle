schemaVersion: 2
tool: cursor
label: Cursor
binary:
  which: cursor
  paths:
    darwin: /Applications/Cursor.app
home: ~/.cursor
enabled: true
mode: multi-select

reorg:
  assets:
    - kind: skill
      canonical: skills
      entries: directories
      locations:
        - path: ~/.agents/skills
          targetClass: universal
        - path: ~/.cursor/skills
          targetClass: provider
    - kind: agent
      canonical: agents/cursor
      entries: files
      locations:
        - path: ~/.cursor/agents
          targetClass: provider
    - kind: command
      canonical: commands/cursor
      entries: files
      locations:
        - path: ~/.cursor/commands
          targetClass: provider

mappings:
  - type: skills
    source: skills
    target: skills
    itemType: skill
  - type: directory
    source: agents
    target: agents
    itemType: agent
  - type: directory
    source: commands
    target: commands
    itemType: command
