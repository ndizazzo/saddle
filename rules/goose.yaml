schemaVersion: 2
tool: goose
label: Goose
binary: goose
home: ~/.config/goose
enabled: true
mode: multi-select

reorg:
  assets:
    - kind: skill
      canonical: skills
      entries: directories
      locations:
        - path: ~/.agents/skills
          targetClass: universal
        - path: ~/.config/goose/skills
          targetClass: provider

mappings:
  - type: skills
    source: skills
    target: skills
    itemType: skill
