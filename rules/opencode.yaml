tool: opencode
label: OpenCode
binary: opencode
home: ~/.config/opencode
enabled: true

mappings:
  - type: file
    source: agents/opencode/AGENTS.md
    target: AGENTS.md
  - type: directory
    source: opencode
    target: .
  - type: directory
    source: agents
    target: agents
  - type: skills
    source: skills
    target: skills
  - type: directory
    source: commands
    target: commands
