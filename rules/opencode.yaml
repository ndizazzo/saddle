schemaVersion: 2
tool: opencode
label: OpenCode
binary: opencode
home: ~/.config/opencode
enabled: true
mode: multi-select

reorg:
  assets:
    - kind: skill
      canonical: skills
      entries: directories
      locations:
        - path: ~/.agents/skills
          targetClass: universal
        - path: ~/.config/opencode/skills
          targetClass: provider
    - kind: agent
      canonical: agents/opencode
      entries: files
      locations:
        - path: ~/.config/opencode/agents
          targetClass: provider
    - kind: command
      canonical: commands/opencode
      entries: files
      locations:
        - path: ~/.config/opencode/commands
          targetClass: provider

mappings:
  - type: file
    source: agents/opencode/AGENTS.md
    target: AGENTS.md
    itemType: root
  - type: directory
    source: opencode
    target: .
    itemType: config
  - type: directory
    source: agents
    target: agents
    itemType: agent
  - type: skills
    source: skills
    target: skills
    itemType: skill
  - type: directory
    source: commands
    target: commands
    itemType: command
