schemaVersion: 2
tool: gemini
label: Gemini
binary: gemini
home: ~/.gemini
enabled: true
mode: multi-select

reorg:
  assets:
    - kind: skill
      canonical: skills
      entries: directories
      locations:
        - path: ~/.agents/skills
          targetClass: universal
        - path: ~/.gemini/skills
          targetClass: provider
    - kind: agent
      canonical: agents/gemini
      entries: files
      locations:
        - path: ~/.gemini/agents
          targetClass: provider
    - kind: command
      canonical: commands/gemini
      entries: files
      locations:
        - path: ~/.gemini/commands
          targetClass: provider

mappings:
  - type: file
    source: agents/gemini/GEMINI.md
    target: GEMINI.md
    itemType: root
  - type: directory
    source: configurations/gemini
    target: .
    itemType: config
  - type: directory
    source: agents
    target: agents
    itemType: agent
  - type: skills
    source: skills
    target: skills
    itemType: skill
  - type: directory
    source: commands
    target: commands
    itemType: command
