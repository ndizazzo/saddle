name: Feature Request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome! Describe what you need and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Context on the workflow or pain point this would address.
      placeholder: "I maintain configs for both work and personal machines with different tool sets, and there's no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples from other tools, mockups, etc.
