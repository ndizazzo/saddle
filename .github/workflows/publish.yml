name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Check if version already published
        id: version-check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: ${PACKAGE_VERSION}"
          if npm show saddle-cli@${PACKAGE_VERSION} version --json 2>/dev/null; then
            echo "Version ${PACKAGE_VERSION} already exists on npm — skipping publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${PACKAGE_VERSION} not found on npm — proceeding with publish."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - run: pnpm publish --no-git-checks --access public
        if: steps.version-check.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
